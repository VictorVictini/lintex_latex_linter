<!DOCTYPE html>
<html>
    <head>
        <title>View Page</title>
        <link rel="stylesheet" href="/styles/view.css">
    </head>
    <body>
        <h1>{{.Title}}</h1>
        <div><textarea name="body" rows="20" cols="80">{{printf "%s" .Body}}</textarea></div>
        <div><input type="submit" value="Save"></div>
        <div>
            {{range .Responses}}
                <div><p>{{.}}</p></div>
            {{end}}
        </div>
    </body>
</html>
