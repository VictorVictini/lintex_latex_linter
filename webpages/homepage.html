<!DOCTYPE html>
<html>
    <head>
        <title>LinTeX</title>
        <link rel="stylesheet" href="/styles/home.css">
    </head>
    <body>
        <form id="form" action="/tool/" method="POST" enctype="multipart/form-data" >
            <h1>LinTeX: Promoting Accessibility in LaTeX</h1>
            <label for="tex_file">Choose a LaTeX file:</label>
            <input type="file" id="tex_file" name="tex_file" accept=".tex" />
            <div><input type="submit" value="Submit"></div>
        </form>
    </body>
</html>
